name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change to master if your default branch is named master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Removed the 'cache: npm' setting that strictly requires a lockfile

      - name: Install Dependencies
        # Changed from 'npm ci' to 'npm install' to generate dependencies fresh on the runner
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/client # Changed from .output/public
          branch: gh-pages
